<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Palacín Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Sora', 'sans-serif'] },
                    colors: {
                        navy: { 900: '#0a0c1a', 950: '#05060d' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                        mocha: { 400: '#a18262', 500: '#785b3c', 600: '#5e432c' },
                        slate: { 400: '#94a3b8', 500: '#64748b', 600: '#475569' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background: radial-gradient(circle at 0% 0%, #1a1f35 0%, #0a0c1a 100%); color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glow-bg { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.15; }
        @keyframes pulse-soft { 0%, 100% { opacity: 0.15; transform: scale(1); } 50% { opacity: 0.25; transform: scale(1.1); } }
        .animate-pulse-soft { animation: pulse-soft 8s infinite ease-in-out; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>

<body class="min-h-screen font-sans selection:bg-gold-500/30">
    <div class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center flex-col z-[100]" id="cooldownOverlay">
        <div class="text-center p-8 glass-card rounded-3xl">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-gold-500 border-t-transparent mb-4"></div>
            <h2 class="text-2xl font-display font-bold text-white mb-2">Bloqueo de Seguridad</h2>
            <p class="text-gold-400 font-mono text-3xl" id="cooldownTimerText">15s</p>
            <p class="text-white/40 text-sm mt-4 italic">Alguien ha registrado una acción recientemente...</p>
        </div>
    </div>

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="glow-bg bg-gold-500 top-[-10%] left-[-10%] animate-pulse-soft"></div>
        <div class="glow-bg bg-mocha-500 bottom-[-10%] right-[-10%] animate-pulse-soft" style="animation-delay: -4s;"></div>
    </div>

    <div class="flex flex-col lg:flex-row min-h-screen">
        <aside class="w-full lg:w-72 glass-card border-r border-white/5 flex flex-col p-6 z-10">
            <div class="mb-10 flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-gold-400 to-gold-600 rounded-xl flex items-center justify-center shadow-lg shadow-gold-500/20">
                    <span class="text-navy-950 font-display font-extrabold text-xl">P</span>
                </div>
                <h1 class="font-display font-bold text-2xl tracking-tight text-white">Palacín Pro</h1>
            </div>
            <nav class="space-y-4 flex-grow">
                <div class="records-bar p-4 rounded-2xl bg-white/5 border border-white/10 space-y-3">
                    <p class="text-[10px] text-gold-400 font-bold uppercase tracking-widest">🏆 Máximos Diarios</p>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><p class="text-xs text-white/40">🦖</p><p class="font-bold text-sm" id="rec-dino">0</p></div>
                        <div><p class="text-xs text-white/40">☕</p><p class="font-bold text-sm" id="rec-coffee">0</p></div>
                        <div><p class="text-xs text-white/40">🚬</p><p class="font-bold text-sm" id="rec-smoke">0</p></div>
                    </div>
                </div>
            </nav>
            <div class="mt-auto pt-6 border-t border-white/5">
                <p class="text-[10px] text-white/20 uppercase font-bold mb-4">Fecha Actual</p>
                <p id="fecha-actual" class="text-sm font-medium text-gold-400 uppercase"></p>
            </div>
        </aside>

        <main class="flex-grow p-4 lg:p-8 overflow-y-auto">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="glass-card rounded-3xl p-6 relative overflow-hidden group hover:scale-[1.02] transition-all">
                    <div class="absolute -right-4 -top-4 text-gold-500/10 text-8xl">🦖</div>
                    <p class="text-xs font-bold text-gold-400 uppercase tracking-widest mb-1">Dinos</p>
                    <h3 class="font-display font-extrabold text-5xl mb-6" id="count-dino">0</h3>
                    <div class="flex gap-2">
                        <button class="flex-grow bg-gold-500 text-navy-900 font-bold py-3 rounded-xl text-xs hover:bg-gold-400 active:scale-95 transition-all action-btn" onclick="incrementar('dino')">SUMAR</button>
                        <button class="px-4 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 action-btn" onclick="decrementar('dino')">➖</button>
                    </div>
                </div>
                <div class="glass-card rounded-3xl p-6 relative overflow-hidden group hover:scale-[1.02] transition-all">
                    <div class="absolute -right-4 -top-4 text-mocha-500/10 text-8xl">☕</div>
                    <p class="text-xs font-bold text-mocha-400 uppercase tracking-widest mb-1">Cafés</p>
                    <h3 class="font-display font-extrabold text-5xl mb-6" id="count-cafe">0</h3>
                    <div class="flex gap-2">
                        <button class="flex-grow bg-mocha-500 text-white font-bold py-3 rounded-xl text-xs hover:bg-mocha-400 active:scale-95 transition-all action-btn" onclick="incrementar('coffee')">SUMAR</button>
                        <button class="px-4 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 action-btn" onclick="decrementar('coffee')">➖</button>
                    </div>
                </div>
                <div class="glass-card rounded-3xl p-6 relative overflow-hidden group hover:scale-[1.02] transition-all">
                    <div class="absolute -right-4 -top-4 text-slate-500/10 text-8xl">🚬</div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Gascón</p>
                    <h3 class="font-display font-extrabold text-5xl mb-6" id="count-smoke">0</h3>
                    <div class="flex gap-2">
                        <button class="flex-grow bg-slate-500 text-white font-bold py-3 rounded-xl text-xs hover:bg-slate-400 active:scale-95 transition-all action-btn" onclick="incrementar('smoke')">SUMAR</button>
                        <button class="px-4 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 action-btn" onclick="decrementar('smoke')">➖</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                <div class="xl:col-span-2 space-y-8">
                    <div class="glass-card rounded-3xl p-8">
                        <div class="flex items-center justify-between mb-8">
                            <h2 class="font-display font-bold text-xl">Estadísticas</h2>
                            <div class="flex bg-white/5 p-1 rounded-xl gap-1 border border-white/10">
                                <button class="px-4 py-1.5 text-[10px] font-bold rounded-lg bg-white/10 text-white sub-tab-btn active" onclick="switchChartView('daily', this)">DIARIO</button>
                                <button class="px-4 py-1.5 text-[10px] font-bold rounded-lg text-white/40 hover:text-white sub-tab-btn" onclick="switchChartView('weekly', this)">SEMANAL</button>
                                <button class="px-4 py-1.5 text-[10px] font-bold rounded-lg text-white/40 hover:text-white sub-tab-btn" onclick="switchChartView('monthly', this)">MENSUAL</button>
                            </div>
                        </div>
                        <div class="h-[350px] w-full">
                            <canvas id="mainChart"></canvas>
                        </div>
                    </div>

                    <div class="glass-card rounded-3xl overflow-hidden relative h-80 group">
                        <div id="rafa-carousel" class="w-full h-full relative">
                            </div>
                        <div class="absolute bottom-6 left-6 z-20">
                            <span class="bg-gold-500 text-navy-950 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter shadow-xl">The Rafa Collection</span>
                        </div>
                        <button onclick="moveSlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 z-30 p-3 bg-black/40 backdrop-blur-md rounded-full opacity-0 group-hover:opacity-100 transition-opacity">❮</button>
                        <button onclick="moveSlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 z-30 p-3 bg-black/40 backdrop-blur-md rounded-full opacity-0 group-hover:opacity-100 transition-opacity">❯</button>
                    </div>
                </div>

                <div class="glass-card rounded-3xl p-8 flex flex-col h-[750px]">
                    <h2 class="font-display font-bold text-xl mb-6">Actividad Reciente</h2>
                    <div id="log-lista" class="space-y-4 overflow-y-auto custom-scrollbar flex-grow pr-2">
                        </div>
                    <div class="mt-6 pt-6 border-t border-white/5 space-y-4">
                        <h2 class="font-display font-bold text-lg">Historial Completo</h2>
                        <div id="history-container" class="space-y-3 overflow-y-auto custom-scrollbar max-h-64 pr-2 text-xs">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // CONFIGURACIÓN (Usa tus llaves de siempre)
        const firebaseConfig = {
            apiKey: "AIzaSyCfEoMAHh3xBClnXNKxQm--9HKE8GebXns",
            authDomain: "palacin-dashboard.firebaseapp.com",
            databaseURL: "https://palacin-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "palacin-dashboard",
            storageBucket: "palacin-dashboard.firebasestorage.app",
            messagingSenderId: "825240958725",
            appId: "1:825240958725:web:f3d75b8e1d0fbbf011e96c"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref("palacinDB");
        const logsRef = database.ref("logs_clicks");
        const recordsRef = database.ref("records_historicos");
        const lockRef = database.ref("estado_bloqueo");

        let db = {};
        let estaBloqueado = false;
        const TIEMPO_BLOQUEO = 15000;
        const hoy = new Date().toISOString().split("T")[0];
        let mainChart = null;
        let chartMode = 'daily';

        function init() {
            const opciones = { weekday: "long", day: "numeric", month: "long" };
            document.getElementById("fecha-actual").innerText = new Date().toLocaleDateString("es-ES", opciones);

            cargarFotosRafa();
            setInterval(() => moveSlide(1), 5000);

            // Escuchador Principal
            dbRef.on("value", (snapshot) => {
                db = snapshot.val() || {};
                if (!db[hoy]) db[hoy] = { dino: 0, coffee: 0, smoke: 0 };
                refreshUI();
                verificarRecords();
            });

            // Escuchador de Bloqueo Global
            lockRef.on("value", (snapshot) => {
                const data = snapshot.val();
                if (data && data.bloqueado) {
                    const tiempoRestante = TIEMPO_BLOQUEO - (Date.now() - data.timestamp);
                    if (tiempoRestante > 0) activarBloqueoVisual(Math.ceil(tiempoRestante / 1000));
                    else liberarBloqueoVisual();
                } else liberarBloqueoVisual();
            });

            // Logs con formato nuevo diseño
            logsRef.limitToLast(15).on("value", (snapshot) => {
                const logs = snapshot.val();
                const lista = document.getElementById("log-lista");
                if (!logs) return;
                lista.innerHTML = Object.values(logs).reverse().map(log => {
                    const icon = log.tipo === 'dino' ? '🦖' : log.tipo === 'coffee' ? '☕' : '🚬';
                    const color = log.accion === 'resta' ? 'text-red-400' : 'text-emerald-400';
                    const partes = log.fecha.split(', ');
                    return `
                        <div class="flex items-center gap-4 p-3 rounded-2xl bg-white/[0.02] border border-white/5">
                            <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-lg">${icon}</div>
                            <div class="flex-grow">
                                <p class="text-xs font-bold ${color}">${log.accion === 'suma' ? '+1' : '-1'} Registrado</p>
                                <p class="text-[10px] text-white/40 uppercase font-mono">${partes[0]} · ${partes[1]}</p>
                            </div>
                            <div class="text-right"><p class="text-[10px] text-white/20 uppercase font-bold">Total</p><p class="font-bold text-sm">${log.valor_final}</p></div>
                        </div>`;
                }).join("");
            });

            // Records Sidebar
            recordsRef.on("value", (snapshot) => {
                const recs = snapshot.val() || { dino: 0, coffee: 0, smoke: 0 };
                document.getElementById("rec-dino").innerText = recs.dino || 0;
                document.getElementById("rec-coffee").innerText = recs.coffee || 0;
                document.getElementById("rec-smoke").innerText = recs.smoke || 0;
            });
        }

        // --- LÓGICA DE NEGOCIO ---
        function incrementar(tipo) {
            if (estaBloqueado) return;
            lockRef.set({ bloqueado: true, timestamp: firebase.database.ServerValue.TIMESTAMP });
            db[hoy][tipo] = (db[hoy][tipo] || 0) + 1;
            const nuevoValor = db[hoy][tipo];
            dbRef.child(hoy).set(db[hoy]);
            logsRef.push({
                tipo: tipo, accion: "suma", valor_final: nuevoValor,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                fecha: new Date().toLocaleString("es-ES")
            });
            if (tipo === "dino" && nuevoValor === 31) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function decrementar(tipo) {
            if (estaBloqueado) return;
            if (db[hoy] && db[hoy][tipo] > 0) {
                lockRef.set({ bloqueado: true, timestamp: firebase.database.ServerValue.TIMESTAMP });
                db[hoy][tipo]--;
                dbRef.child(hoy).set(db[hoy]);
                logsRef.push({
                    tipo: tipo, accion: "resta", valor_final: db[hoy][tipo],
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    fecha: new Date().toLocaleString("es-ES")
                });
            }
        }

        function verificarRecords() {
            let maxs = { dino: 0, coffee: 0, smoke: 0 };
            Object.keys(db).forEach(f => {
                if (db[f].dino > maxs.dino) maxs.dino = db[f].dino;
                if (db[f].coffee > maxs.coffee) maxs.coffee = db[f].coffee;
                if (db[f].smoke > maxs.smoke) maxs.smoke = db[f].smoke;
            });
            recordsRef.set(maxs);
        }

        // --- UI & GRAFICOS ---
        function refreshUI() {
            const d = db[hoy] || { dino: 0, coffee: 0, smoke: 0 };
            document.getElementById("count-dino").innerText = d.dino || 0;
            document.getElementById("count-cafe").innerText = d.coffee || 0;
            document.getElementById("count-smoke").innerText = d.smoke || 0;
            renderHistory();
            updateMainChart();
        }

        function switchChartView(mode, btn) {
            chartMode = mode;
            document.querySelectorAll('.sub-tab-btn').forEach(b => {
                b.classList.remove('bg-white/10', 'text-white');
                b.classList.add('text-white/40');
            });
            btn.classList.add('bg-white/10', 'text-white');
            btn.classList.remove('text-white/40');
            updateMainChart();
        }

        function updateMainChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            let labels = [], dDino = [], dCoffee = [], dSmoke = [];

            if (chartMode === 'daily') {
                labels = Object.keys(db).sort().slice(-7).map(d => new Date(d).toLocaleDateString('es-ES', {weekday:'short'}));
                const keys = Object.keys(db).sort().slice(-7);
                dDino = keys.map(k => db[k].dino || 0);
                dCoffee = keys.map(k => db[k].coffee || 0);
                dSmoke = keys.map(k => db[k].smoke || 0);
            } else if (chartMode === 'weekly') {
                const weekly = {};
                Object.keys(db).forEach(d => {
                    const wk = "Sem " + getWeekNumber(new Date(d));
                    if(!weekly[wk]) weekly[wk] = {d:0, c:0, s:0};
                    weekly[wk].d += db[d].dino || 0;
                    weekly[wk].c += db[d].coffee || 0;
                    weekly[wk].s += db[d].smoke || 0;
                });
                labels = Object.keys(weekly).slice(-5);
                dDino = labels.map(l => weekly[l].d);
                dCoffee = labels.map(l => weekly[l].c);
                dSmoke = labels.map(l => weekly[l].s);
            }

            if (mainChart) mainChart.destroy();
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Dinos', data: dDino, borderColor: '#f59e0b', tension: 0.4, fill: true, backgroundColor: 'rgba(245, 158, 11, 0.1)' },
                        { label: 'Cafés', data: dCoffee, borderColor: '#a18262', tension: 0.4, fill: true, backgroundColor: 'rgba(161, 130, 98, 0.1)' },
                        { label: 'Gascón', data: dSmoke, borderColor: '#94a3b8', tension: 0.4, fill: true, backgroundColor: 'rgba(148, 163, 184, 0.1)' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#475569' } },
                        x: { grid: { display: false }, ticks: { color: '#475569' } }
                    }
                }
            });
        }

        function renderHistory() {
            const container = document.getElementById("history-container");
            const sorted = Object.keys(db).sort((a,b) => b.localeCompare(a));
            container.innerHTML = sorted.map(dateStr => {
                const day = db[dateStr];
                return `<div class="flex justify-between p-2 rounded-lg bg-white/[0.02]">
                    <span class="text-white/40 font-mono">${dateStr === hoy ? 'HOY' : dateStr}</span>
                    <span class="font-bold">🦖${day.dino || 0}  ☕${day.coffee || 0}  🚬${day.smoke || 0}</span>
                </div>`;
            }).join("");
        }

        // --- CARRUSEL RAFA ---
        let currentSlide = 0;
        function cargarFotosRafa() {
            const container = document.getElementById("rafa-carousel");
            for (let i = 1; i <= 12; i++) {
                const slide = document.createElement("div");
                slide.className = `carousel-slide absolute inset-0 transition-opacity duration-1000 ${i === 1 ? 'opacity-100 active' : 'opacity-0'}`;
                slide.innerHTML = `<img src="./rata/R${i}.png" class="w-full h-full object-cover">`;
                container.appendChild(slide);
            }
        }
        function moveSlide(dir) {
            const slides = document.querySelectorAll(".carousel-slide");
            slides[currentSlide].classList.replace('opacity-100', 'opacity-0');
            currentSlide = (currentSlide + dir + slides.length) % slides.length;
            slides[currentSlide].classList.replace('opacity-0', 'opacity-100');
        }

        // --- BLOQUEO ---
        function activarBloqueoVisual(segundos) {
            estaBloqueado = true;
            const overlay = document.getElementById('cooldownOverlay');
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
            let r = segundos;
            document.getElementById('cooldownTimerText').innerText = r + "s";
            const it = setInterval(() => {
                r--;
                if (r <= 0) { clearInterval(it); lockRef.set({ bloqueado: false, timestamp: 0 }); }
                else document.getElementById('cooldownTimerText').innerText = r + "s";
            }, 1000);
        }
        function liberarBloqueoVisual() {
            estaBloqueado = false;
            document.getElementById('cooldownOverlay').classList.replace('flex', 'hidden');
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            return Math.ceil(((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
        }

        init();
    </script>
</body>
</html>
